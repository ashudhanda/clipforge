# ClipForge one-click installers.
# PyInstaller can't cross-compile, so each OS builds on its own runner.
# Pushing a tag like v0.1.0 drafts a GitHub Release with all three installers.
name: build-installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ffmpeg: win
            artifact: ClipForge-Setup.exe
          - os: macos-latest
            ffmpeg: mac
            artifact: ClipForge.dmg
          - os: ubuntu-latest
            ffmpeg: linux
            artifact: ClipForge-linux64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Fetch FFmpeg (Windows)
        if: matrix.ffmpeg == 'win'
        shell: powershell
        run: ./packaging/fetch-ffmpeg.ps1

      - name: Fetch FFmpeg (macOS)
        if: matrix.ffmpeg == 'mac'
        run: ./packaging/fetch-ffmpeg.sh macos

      - name: Fetch FFmpeg (Linux)
        if: matrix.ffmpeg == 'linux'
        run: ./packaging/fetch-ffmpeg.sh linux64

      - name: PyInstaller build
        run: pyinstaller packaging/clipforge.spec

      - name: Verify FFmpeg bundled (Windows)
        if: matrix.ffmpeg == 'win'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ff = "dist/ClipForge/_internal/ffmpeg.exe"
          $fp = "dist/ClipForge/_internal/ffprobe.exe"
          foreach ($p in @($ff, $fp)) {
            if (-not (Test-Path $p)) { throw "FATAL: $p missing from bundle" }
            # Capture FULL output: piping to Select-Object -First 1 closes the
            # pipe early, which kills the native exe and leaves $LASTEXITCODE=1
            # behind on Windows PowerShell 5.1 -- failing the step after every
            # check already passed.
            $ver = (& $p -hide_banner -version 2>&1) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "FATAL: $p -version exited with code $LASTEXITCODE" }
            Write-Host "$p -> $($ver.Split("`n")[0])"
          }
          Write-Host "OK: ffmpeg + ffprobe present and executable in bundle"
          exit 0

      - name: Verify FFmpeg bundled (macOS/Linux)
        if: matrix.ffmpeg != 'win'
        run: |
          set -e
          FF=$(find dist -name ffmpeg -type f | head -1)
          FP=$(find dist -name ffprobe -type f | head -1)
          [ -n "$FF" ] || { echo "FATAL: ffmpeg missing from bundle"; exit 1; }
          [ -n "$FP" ] || { echo "FATAL: ffprobe missing from bundle"; exit 1; }
          "$FF" -hide_banner -version | head -1
          "$FP" -hide_banner -version | head -1
          echo "OK: ffmpeg + ffprobe present and executable in bundle"

      - name: Inno Setup installer (Windows)
        if: matrix.ffmpeg == 'win'
        shell: powershell
        run: |
          choco install innosetup -y
          $ver = python -c "from core.version import __version__; print(__version__)"
          iscc /DAppVersion=$ver packaging/installer.iss
          Move-Item dist/ClipForge-Setup-*.exe dist/ClipForge-Setup.exe -Force

      - name: DMG (macOS)
        if: matrix.ffmpeg == 'mac'
        run: |
          hdiutil create -volname "ClipForge" -srcfolder dist/ClipForge.app \
            -ov -format UDZO dist/ClipForge.dmg

      - name: Tarball (Linux)
        if: matrix.ffmpeg == 'linux'
        run: tar -czf dist/ClipForge-linux64.tar.gz -C dist ClipForge

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            ## ClipForge one-click installers (unsigned)

            - **Windows:** run `ClipForge-Setup.exe`. SmartScreen will warn
              "Unknown publisher" — click **More info → Run anyway**.
            - **macOS:** open `ClipForge.dmg`, drag to Applications. First launch:
              right-click → **Open** (Gatekeeper, app is unsigned).
            - **Linux:** extract `ClipForge-linux64.tar.gz` and run `ClipForge/ClipForge`.

            The app opens in your browser — no terminal, no Python needed.
            FFmpeg is bundled. Your YouTube keys stay on your machine.
